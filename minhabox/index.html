  var en=g(['enviado','entregue']);if(en.length)h+='<div class="bloco"><h2>Já enviados <span class="cont">· '+en.length+'</span></h2>'+en.slice().reverse().slice(0,15).map(item).join('')+(en.length>15?'<p class="peq fraco">Os outros estão na sua coleção.</p>':'')+'</div>';
  var semItem=D.rastreios.filter(function(r){return !it.some(function(x){return x.rastreio===r.rastreio})});
  if(semItem.length)h+='<div class="bloco"><h2>Rastreios</h2>'+semItem.map(function(r){return '<div class="item"><div class="cab"><b class="num">'+esc(r.rastreio)+'</b><a href="'+correios(r.rastreio)+'" target="_blank" rel="noopener">Ver nos Correios</a></div><p class="peq fraco">'+esc(r.servico)+(r.postadoEm?' · postado '+esc(r.postadoEm):'')+'</p></div>'}).join('')+'</div>';
  return h||'<div class="bloco"><p class="fraco">Sua box está vazia por enquanto.</p></div>'}
function chips(l){return '<div class="chips">'+l.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join('')+'</div>'}
function lista(t,l,sub){return l&&l.length?'<div class="bloco"><h2>'+t+' <span class="cont">· '+l.length+'</span></h2>'+(sub?'<p class="peq fraco">'+sub+'</p>':'')+chips(l)+'</div>':''}
function tColecao(){var c=D.colecao;if(!c)return '<div class="bloco"><p class="fraco">Sua coleção aparece aqui depois das primeiras compras.</p></div>';
  return '<div class="numeros"><div><b class="num">'+c.perfumes+'</b><span>perfumes</span></div><div><b class="num">'+Math.round(c.ml)+'</b><span>ml no total</span></div><div><b class="num">'+c.casas+'</b><span>casas</span></div></div>'+
  (c.desde?'<p class="atualizado" style="margin-top:12px">Com a gente desde '+esc(c.desde)+'</p>':'')+lista('Seus favoritos',c.gosta,'Os que você levou em APC, em quantidade maior ou mais de uma vez.')+lista('Pegou para usar',c.interesse,'Decants de tamanho médio.')+lista('Pegou para conhecer',c.conhecer,'Decants pequenos, para provar.')}
function chamaQuiz(){var feito=D.quiz||ls('mb-quiz-'+COD);return '<div class="bloco"><h3>'+(feito?'Quiz respondido ✓':'Deixe seu perfil mais certeiro')+'</h3><p class="peq fraco">'+(feito?'Suas respostas já entram no seu perfil e nas sugestões de aberturas.':'Responda o quiz (uns 2 minutos): suas respostas entram no perfil e nas aberturas que combinam com você.')+'</p><button class="'+(feito?'sem':'pri')+'" data-aba="quiz">'+(feito?'Ver ou mudar respostas':'Responder o quiz')+'</button></div>'}
function tPerfil(){var p=D.perfil;if(!p)return '<div class="bloco"><p class="fraco">Seu perfil olfativo se forma com mais algumas compras.</p></div>'+chamaQuiz();
  var bl=function(t,l){return l&&l.length?'<h3>'+t+'</h3>'+chips(l):''};
  return '<div class="bloco"><h2>Seu perfil olfativo</h2>'+(p.resumo?'<p>'+esc(p.resumo)+'</p>':'')+bl('Famílias',p.familias)+bl('Notas que mais aparecem',p.notas)+bl('Notas que você ama',p.ama)+bl('Casas preferidas',p.casas)+
  (CONF.whats?'<a class="peq" target="_blank" rel="noopener" href="'+esc(wa('Olá! Vi meu perfil olfativo na Minha Box e queria ajustar uma coisa: '))+'">Não é bem você? Conta pra gente</a>':'')+'</div>'+chamaQuiz()}
function quizResumo(r){return CONF.quiz.filter(function(q){return r[q.id]}).map(function(q){var v=r[q.id];
  return '<h3>'+esc(q.t)+'</h3>'+(Array.isArray(v)?chips(v):'<p>'+esc(v)+'</p>')}).join('')}
function tQuiz(){
  var salvo=D.quiz||(function(){try{return JSON.parse(ls('mb-quiz-'+COD)||'null')}catch(e){return null}})();
  if(S.adm)return '<div class="bloco"><h2>Quiz do perfil</h2>'+(salvo?'<p class="peq fraco">Respondido em '+esc(D.quizEm||'')+'</p>'+quizResumo(salvo):'<p class="fraco">Ainda não respondeu.</p>')+'</div>';
  if(salvo&&!QZEDIT)return '<div class="bloco"><h2>Suas respostas</h2>'+(D.quiz?'':'<p class="peq fraco">Recebemos! Em alguns minutos elas entram no seu perfil.</p>')+quizResumo(salvo)+'<button class="sem" data-qz-editar>Mudar respostas</button></div>';
  if(!QZ)QZ=JSON.parse(JSON.stringify(salvo||{}));
  var h='<div class="bloco"><h2>Quiz do perfil olfativo</h2><p class="peq fraco">Conte um pouco do seu gosto. Quanto mais você responder, mais certeiras ficam as sugestões. Nenhuma pergunta é obrigatória.</p></div>';
  CONF.quiz.forEach(function(q){var v=QZ[q.id];
    h+='<div class="bloco qz"><h3>'+esc(q.t)+'</h3>'+(q.d?'<p class="peq fraco">'+esc(q.d)+'</p>':'');
    if(q.tipo==='multi'||q.tipo==='um'){var sel=q.tipo==='um'?[v]:(v||[]);
      h+='<div class="ops">'+q.op.map(function(o){return '<button type="button" class="op" aria-pressed="'+(sel.indexOf(o)>=0)+'" data-qz="'+esc(q.id)+'" data-v="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>';
      if(q.outro){var extra=(v||[]).filter(function(x){return q.op.indexOf(x)<0});h+='<input class="qz-outro" data-qz-outro="'+esc(q.id)+'" placeholder="Outras (separe por vírgula)" value="'+esc(extra.join(', '))+'">'}}
    else if(q.tipo==='texto')h+='<textarea data-qz-txt="'+esc(q.id)+'" rows="3" placeholder="Um por linha">'+esc((v||[]).join('\n'))+'</textarea>';
    else h+='<textarea data-qz-livre="'+esc(q.id)+'" rows="3">'+esc(v||'')+'</textarea>';
    h+='</div>'});
  return h+'<div class="bloco"><p class="erro" id="qz-erro" hidden></p><button class="pri" data-qz-enviar>Enviar respostas</button>'+(salvo?'<button class="sem" data-qz-cancelar>Cancelar</button>':'')+'</div>'}
function qzLer(){document.querySelectorAll('[data-qz-outro]').forEach(function(i){var id=i.getAttribute('data-qz-outro'),q=CONF.quiz.filter(function(x){return x.id===id})[0];
    var base=(QZ[id]||[]).filter(function(x){return q.op.indexOf(x)>=0}),ext=i.value.split(',').map(function(x){return x.trim()}).filter(Boolean);QZ[id]=base.concat(ext).slice(0,q.max||8)});
  document.querySelectorAll('[data-qz-txt]').forEach(function(i){QZ[i.getAttribute('data-qz-txt')]=i.value.split('\n').map(function(x){return x.trim()}).filter(Boolean).slice(0,5)});
  document.querySelectorAll('[data-qz-livre]').forEach(function(i){QZ[i.getAttribute('data-qz-livre')]=i.value.trim().slice(0,600)});
  Object.keys(QZ).forEach(function(k){var v=QZ[k];if(!v||(Array.isArray(v)&&!v.length))delete QZ[k]})}
async function qzEnviar(b){qzLer();var er=document.getElementById('qz-erro');if(Object.keys(QZ).length<2){er.textContent='Responda pelo menos duas perguntas.';er.hidden=false;return}
  b.disabled=true;b.textContent='Enviando...';
  try{await enviar({acao:'quiz',respostas:QZ});ls('mb-quiz-'+COD,JSON.stringify(QZ));QZEDIT=false;QZ=null;tela();window.scrollTo(0,0)}
  catch(e){er.textContent='Não consegui enviar agora. Tente de novo em instantes.';er.hidden=false;b.disabled=false;b.textContent='Enviar respostas'}}
function tAberturas(){if(!D.aberturas.length)return '<div class="bloco"><p class="fraco">Nenhum split aberto agora. Fique de olho no grupo!</p></div>';
  return '<p class="atualizado">'+(D.combinam?'Splits abertos agora que combinam com o seu perfil.':'Splits abertos agora.')+'</p>'+D.aberturas.map(function(a){
    return '<div class="bloco"><div class="cab"><h3>'+esc(a.perfume)+'</h3>'+(a.jaTem?'<span class="tag">Você já provou</span>':'')+'</div>'+(a.motivo?'<p class="peq fraco">'+esc(a.motivo)+'</p>':'')+
    (a.notas.length?chips(a.notas):'')+'<p class="peq fraco">Restam <b class="num">'+ml(a.resta)+'</b> no frasco.</p>'+
    (S.adm?'':'<p class="peq">Pedir no grupo:</p><div class="ops">'+a.precos.map(function(p){return '<button class="op" data-pedir="'+esc(a.perfume)+'" data-ml="'+p[2]+'">'+esc(p[0])+' · <span class="num">'+brl(p[1])+'</span></button>'}).join('')+
      (!a.precos.length||a.precos[a.precos.length-1][2]<a.resta?'<button class="op" data-pedir="'+esc(a.perfume)+'" data-ml="'+a.resta+'">Os '+ml(a.resta)+' que restam'+(a.restaPreco?' · <span class="num">'+brl(a.restaPreco)+'</span>':'')+'</button>':'')+'</div>'+
      '<p class="peq fraco">Abre o WhatsApp com a mensagem pronta: é só escolher o grupo e enviar.</p>')+'</div>'}).join('')}
function tela(){var o=document.getElementById('out');document.body.classList.add('dentro');
  if(CONTA){o.innerHTML='<div class="barra"><div><p class="ola">Olá, '+esc(D.nome)+'!</p></div><div class="acoes-topo"><button class="mini sem" data-sair>Sair</button></div></div>'+tConta();var fc=document.getElementById('fc');fc.onsubmit=function(e){e.preventDefault();salvarConta(fc)};return}
  if(FORM){o.innerHTML='<div class="barra"><div><p class="ola">Olá, '+esc(D.nome)+'!</p></div><div class="acoes-topo"><button class="mini sem" data-sair>Sair</button></div></div>'+tDados();var f=document.getElementById('fd');f.onsubmit=function(e){e.preventDefault();salvarDados(f)};f.elements.cep.onchange=function(){buscaCep(this.value)};return}
  var abas=[['box','Minha box'],['colecao','Coleção'],['perfil','Perfil olfativo'],['aberturas','Aberturas']],ativa=ABA==='quiz'?'perfil':ABA;
  var h=(S.adm?'<div class="faixa"><p><b>Acesso mestre</b> <span class="fraco">vendo a box de '+esc(D.nomeCompleto||D.nome)+' (só leitura)</span></p></div>':'')+
    '<div class="barra"><div><p class="ola">Olá, '+esc(D.nome)+'!</p><p class="atualizado">Atualizado em '+esc(D.atualizado||'')+'</p></div><div class="acoes-topo">'+
    (S.adm?'<button class="mini" data-lista>Lista</button>':'<button class="mini" data-conta aria-label="Minha conta">Conta</button>')+'<button class="mini sem" data-sair>Sair</button></div></div>'+'<div class="abas" role="tablist">'+abas.map(function(a){return '<button class="aba" role="tab" aria-selected="'+(ativa===a[0])+'" data-aba="'+a[0]+'">'+a[1]+'</button>'}).join('')+'</div>';
  o.innerHTML=h+(ABA==='colecao'?tColecao():ABA==='perfil'?tPerfil():ABA==='quiz'?'<div class="topo" style="justify-content:flex-start;margin:6px 0 0"><button class="sem" data-aba="perfil">← Voltar ao perfil</button></div>'+tQuiz():ABA==='aberturas'?tAberturas():tBox());
  var ab=o.querySelector('.abas'),at=ab&&ab.querySelector('[aria-selected=true]');if(at)ab.scrollLeft=Math.max(0,at.offsetLeft-ab.clientWidth/2+at.offsetWidth/2)}
document.addEventListener('click',async function(e){var cp=e.target.closest('[data-copiar]');if(cp){var v=cp.getAttribute('data-copiar'),ok=function(){var t=cp.textContent;cp.textContent='Copiado ✓';setTimeout(function(){cp.textContent=t},1800)};
    try{await navigator.clipboard.writeText(v);ok()}catch(x){var ta=document.createElement('textarea');ta.value=v;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(y){}ta.remove()}return}
  var pd=e.target.closest('[data-pedir]');if(pd){var mlp=pd.getAttribute('data-ml');window.open('https://wa.me/?text='+encodeURIComponent('Quero '+String(mlp).replace('.',',')+'ml do '+pd.getAttribute('data-pedir')+' 🙋'),'_blank','noopener');return}
  var sv=e.target.closest('[data-serv]');if(sv){SERV[sv.getAttribute('data-serv')]=+sv.getAttribute('data-i');var y=window.scrollY;tela();window.scrollTo(0,y);return}
  var pr=e.target.closest('[data-primeiro]');if(pr){PRIMEIRO=true;document.getElementById('fe-t').textContent='Primeiro acesso';document.getElementById('fe-p').textContent='Digite seu celular com DDD. Mandamos a sua senha no WhatsApp em até 10 minutos.';document.getElementById('f').hidden=true;document.getElementById('fe').hidden=false;document.getElementById('lge').value=document.getElementById('lg').value;document.getElementById('lge').focus();return}
  var o=e.target.closest('[data-olho]');if(o){var inp=o.parentNode.querySelector('input'),ver=inp.type==='password';inp.type=ver?'text':'password';o.setAttribute('aria-pressed',ver);o.setAttribute('aria-label',ver?'Esconder senha':'Mostrar senha');return}
  var t=e.target.closest('[data-tentar],[data-aba],[data-dados],[data-fechar],[data-pular],[data-pix],[data-conta],[data-sair],[data-depois],[data-esqueci],[data-voltar],[data-adm],[data-lista],[data-qz],[data-qz-enviar],[data-qz-editar],[data-qz-cancelar]');if(!t)return;
  if(t.hasAttribute('data-sair'))return sair();
  if(t.hasAttribute('data-tentar'))return abrir();
  if(t.hasAttribute('data-qz')){var id=t.getAttribute('data-qz'),v=t.getAttribute('data-v'),q=CONF.quiz.filter(function(x){return x.id===id})[0];qzLer();
    if(q.tipo==='um'){QZ[id]=QZ[id]===v?'':v;document.querySelectorAll('[data-qz="'+id+'"]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===QZ[id])})}
    else{var l=QZ[id]||[],i=l.indexOf(v);if(i>=0)l.splice(i,1);else if(l.length<(q.max||8))l.push(v);else return;QZ[id]=l;t.setAttribute('aria-pressed',i<0)}return}
  if(t.hasAttribute('data-qz-enviar'))return qzEnviar(t);
  if(t.hasAttribute('data-qz-editar')){QZEDIT=true;QZ=null;tela();return}
  if(t.hasAttribute('data-qz-cancelar')){QZEDIT=false;QZ=null;tela();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-adm')){var x=ADM[+t.getAttribute('data-adm')];S={arq:x.arq,k:x.k,t:'s',adm:1};ABA='box';abrir();return}
  if(t.hasAttribute('data-lista')){S=null;D=null;telaAdm();return}
  if(t.hasAttribute('data-esqueci')){document.getElementById('f').hidden=true;document.getElementById('fe').hidden=false;document.getElementById('lge').value=document.getElementById('lg').value;return}
  if(t.hasAttribute('data-voltar')){location.reload();return}
  if(t.hasAttribute('data-conta')){CONTA=true;FORM=false;tela();window.scrollTo(0,0);return}
  if(t.hasAttribute('data-depois')){if(S.t!=='s')ls('mb-depois-'+COD,'1');CONTA=false;FORM=precisaDados();tela();return}
  if(t.dataset.aba){ABA=t.dataset.aba;tela();window.scrollTo(0,0)}
  else if(t.hasAttribute('data-dados')){FORM=true;tela();window.scrollTo(0,0)}
  else if(t.hasAttribute('data-fechar')){FORM=false;tela()}
  else if(t.hasAttribute('data-pular')){ls('mb-pular-'+COD,'1');FORM=false;tela()}
  else if(t.dataset.pix){t.disabled=true;t.textContent='Avisando...';try{await enviar({acao:'pix_frete',servico:t.dataset.pix,tipo:t.dataset.tipo});ls('mb-pix-'+COD,String(Date.now()));tela();
    if(CONF.whats)window.open(wa('Olá! Paguei o frete '+t.dataset.pix+' da Minha Box no Pix ('+brl(t.dataset.valor)+'). Segue o comprovante. ('+D.nome+')'),'_blank','noopener')}catch(x){t.disabled=false;t.textContent='Não consegui avisar. Tente de novo.'}}});
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();entrar(document.getElementById('lg').value,document.getElementById('sn').value)};
document.getElementById('fe').onsubmit=function(ev){ev.preventDefault();esqueci()};
try{ADM=JSON.parse(ls('mb-adm')||'null')}catch(e){ADM=null}
try{S=JSON.parse(ls('mb-sessao')||'null')}catch(e){S=null}if(ADM)telaAdm();else if(S&&S.arq&&S.k)abrir();else S=null;
</script></main></body></html>
