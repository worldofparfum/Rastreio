<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rastreio · World of Splits</title><meta name="robots" content="noindex">
<style>
:root{--bg:#121214;--panel:#1b1b1f;--line:#2c2c33;--txt:#ecebe8;--fraco:#9c9a94;--ouro:#c9a24a;--ok:#5fb37c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:32px 16px 48px}
.logo{display:block;width:96px;height:96px;margin:0 auto 14px;border-radius:50%;box-shadow:0 0 28px rgba(201,162,74,.35)}
h1{font-size:22px;margin:0 0 4px;letter-spacing:.04em;color:var(--ouro);text-align:center}
.sub{color:var(--fraco);text-align:center;margin:0 0 24px;font-size:14px}
form{display:flex;gap:8px}input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font-size:16px;text-transform:uppercase;letter-spacing:.1em}
button{background:var(--ouro);color:#1a1405;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 6px}.its{color:var(--fraco);font-size:14px;margin:0 0 14px}
.passos{list-style:none;padding:0;margin:0 0 12px}.passos li{position:relative;padding:0 0 12px 26px;color:var(--fraco);font-size:14px}
.passos li:before{content:"";position:absolute;left:5px;top:6px;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.passos li:after{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}.passos li:last-child:after{display:none}
.passos li.f{color:var(--txt)}.passos li.f:before{background:var(--ouro);border-color:var(--ouro)}.passos li.at{color:var(--txt);font-weight:700}
.linha{display:flex;justify-content:space-between;gap:12px;font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px;flex-wrap:wrap}
a{color:var(--ouro)}.msg{color:var(--fraco);text-align:center;margin-top:18px}.ok{color:var(--ok)}
</style></head><body><main>
<img class="logo" src="logo.png" alt="" onerror="this.remove()"><h1>World of Splits</h1><p class="sub">Acompanhe seus envios com o código de acesso que mandamos no WhatsApp.</p>
<form id="f"><input id="c" placeholder="ABCD-1234" autocomplete="off" aria-label="Código de acesso"><button>Ver</button></form>
<div id="out"></div>
<script>
var ETAPAS=[['pago','Pagamento do frete'],['etiqueta','Etiqueta gerada'],['postado','Postado nos Correios'],['transferencia','Em transferência'],['rota','Saiu para entrega'],['entregue','Entregue']];
function norm(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
async function sha(t){var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(h)).map(function(b){return b.toString(16).padStart(2,'0')}).join('').slice(0,32)}
async function abrir(cod){var o=document.getElementById('out');o.innerHTML='<p class="msg">Buscando...</p>';var n=norm(cod);
  try{var r=await fetch('d/'+(await sha('wos-rastreio:'+n))+'.json?t='+Date.now());if(!r.ok)throw 0;var j=await r.json();
    var k=await crypto.subtle.importKey('raw',new TextEncoder().encode(n),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(j.sal),iterations:j.it,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    var d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(j.iv)},key,b64(j.ct))));
    o.innerHTML='<p class="msg">Olá, <b>'+esc(d.nome)+'</b>!</p>'+(d.envios.length?d.envios.map(card).join(''):'<p class="msg">Nenhum envio em andamento no momento. Quando sua próxima caixa sair, ela aparece aqui.</p>');
    try{history.replaceState(null,'','#'+cod)}catch(e){}
  }catch(e){o.innerHTML='<p class="msg">Código não encontrado. Confira o código que mandamos no WhatsApp.</p>'}}
function card(e){var i=ETAPAS.findIndex(function(x){return x[0]===e.etapa});var oc=e.etapa==='ocorrencia';if(oc)i=3;
  return '<div class="card"><h2>'+esc(e.tipo)+(e.servico?' · '+esc(e.servico):'')+'</h2><p class="its">'+e.itens.map(esc).join(' · ')+'</p><ol class="passos">'+
    ETAPAS.map(function(x,j){return '<li class="'+(j<=i?'f':'')+(j===i?' at':'')+'">'+esc(x[1])+(j===i&&e.evento?'<br><span style="font-weight:400;color:var(--fraco)">'+esc(e.evento)+'</span>':'')+'</li>'}).join('')+'</ol>'+
    (oc?'<p class="ok" style="color:#e0a050">'+esc(e.status)+'</p>':'')+
    '<div class="linha"><span>'+(e.rastreio?'Rastreio <b>'+esc(e.rastreio)+'</b>':'Rastreio em breve')+'</span>'+(e.correios?'<a href="'+esc(e.correios)+'" target="_blank" rel="noopener">Ver nos Correios</a>':'')+'</div>'+
    '<div class="linha"><span>'+(e.etapa==='entregue'&&e.entregueEm?'Entregue em '+esc(e.entregueEm):e.postadoEm?'Postado em '+esc(e.postadoEm):'')+'</span><span>'+(e.prazo&&e.etapa!=='entregue'?'Prazo '+esc(e.prazo):'')+'</span></div></div>'}
document.getElementById('f').onsubmit=function(ev){ev.preventDefault();var v=document.getElementById('c').value;if(v)abrir(v)};
var h=decodeURIComponent(location.hash.slice(1));if(h){document.getElementById('c').value=h;abrir(h)}
</script></main></body></html>
